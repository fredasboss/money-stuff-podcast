name: Generate Article Episode
on:
  repository_dispatch:
    types: [new_article]
permissions:
  contents: write
concurrency:
  group: article-episodes
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install kokoro-onnx soundfile trafilatura
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Cache the voice model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download the voice model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Make the episode
        env:
          ARTICLE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          KOKORO_MODEL_DIR: models
          KOKORO_VOICE: af_heart
        run: python articles/process_article.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A articles/
          git commit -m "Add article episode"
          # The Money Stuff workflow may have pushed in the meantime; retry a few times
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Tell Overcast to check the feed now
        continue-on-error: true
        run: |
          FEED_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/articles/feed.xml"
          NEWEST=$(grep -o '<enclosure url="[^"]*"' articles/feed.xml | head -1 | cut -d'"' -f2)
          # wait (up to ~10 min) for GitHub Pages to publish the new episode
          for i in $(seq 1 30); do
            if curl -fsS "$FEED_URL?check=$(date +%s)" | grep -qF "$NEWEST"; then echo "Feed is live"; break; fi
            sleep 20
          done
          curl -fsS -X POST "https://overcast.fm/ping" --data-urlencode "urlprefix=$FEED_URL" && echo "Pinged Overcast"
