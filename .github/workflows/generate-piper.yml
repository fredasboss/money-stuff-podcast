name: Generate Money Stuff Podcast Episode (Kokoro)
on:
  repository_dispatch:
    types: [new_newsletter]
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install kokoro-onnx soundfile mutagen
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Cache the voice model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download the voice model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Generate narration with Kokoro
        env:
          NEWSLETTER_TEXT: ${{ toJson(github.event.client_payload.text) }}
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
          KOKORO_MODEL_DIR: models
          KOKORO_VOICE: af_heart
        run: |
          python - <<'EOF'
          import json
          import os
          import re
          import sys
          from datetime import datetime

          # Same text cleanup and voice as the article feed
          sys.path.insert(0, "articles")
          from process_article import to_paragraphs, narrate

          text = json.loads(os.environ["NEWSLETTER_TEXT"])
          subject = os.environ["NEWSLETTER_SUBJECT"]
          date = os.environ["NEWSLETTER_DATE"]

          # Remove URLs and tidy whitespace
          text = re.sub(r'https?://\S+', '', text)

          # Invisible padding characters Bloomberg puts after the preview line
          # (the voice tried to pronounce them, which sounded like fast gibberish)
          text = re.sub('[\u00ad\u034f\u061c\u115f\u1160\u17b4\u17b5\u180e\u200b-\u200f'
                        '\u2028-\u202e\u2060-\u2064\u3164\ufeff\uffa0]', '', text)
          text = text.replace('\u00a0', ' ')
          # Drop "Read in browser"
          text = re.sub(r'(?im)^[ \t]*(read|view) in (your )?browser[ \t]*$', '', text)
          # Leftovers of removed links and images: "<", ">", "[image: ...]".
          # A "<" on its own line sat where a link was, mid-sentence, so rejoin the sentence.
          text = re.sub(r'\[image:[^\]]*\]', '', text)
          text = re.sub(r'[ \t]*\n[ \t]*[<>][<> \t]*\n[ \t]*(?=\S)', ' ', text)
          text = re.sub(r'[<>]', ' ', text)
          # Cut off the email footer
          footer = re.search(r'(?im)^\s*(unsubscribe|you received this (message|email)|'
                             r'bloomberg l\.p\.\s*\d|ads powered by|follow us\s*$|manage (your )?(newsletter|subscription))',
                             text)
          if footer:
              text = text[:footer.start()]
          text = re.sub(r'[ \t]{2,}', ' ', text)
          text = "\n".join(l.strip() for l in text.split("\n"))
          text = re.sub(r'\n{3,}', '\n\n', text).strip()

          if len(text) > 80000:
              text = text[:80000]

          try:
              spoken_date = datetime.strptime(date, "%Y-%m-%d").strftime("%B %-d, %Y")
          except ValueError:
              spoken_date = date
          title = re.sub(r"^\s*money stuff\s*:\s*", "", subject, flags=re.I).strip()
          body = to_paragraphs(text)
          # the email repeats the title at the top; don't read it twice
          if body and body[0][0].rstrip(".!?").strip().lower() == title.rstrip(".!?").strip().lower():
              body = body[1:]
          title = title if re.search(r"[.!?]$", title) else title + "."
          paragraphs = [(f"Money Stuff, {spoken_date}.", True), (title, True)] + body
          print(f"Narrating {len(paragraphs)} paragraphs")
          narrate(paragraphs, "narration.wav")
          print("Narration saved to narration.wav")
          EOF
      - name: Convert to MP3 and add ID3 tags
        env:
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
        run: |
          mkdir -p audio
          ffmpeg -y -loglevel error -i narration.wav -af "loudnorm=I=-16:TP=-1.5" -ac 1 -codec:a libmp3lame -b:a 48k "audio/${NEWSLETTER_DATE}.mp3"
          python - <<'EOF'
          import os
          from mutagen.id3 import ID3, TIT2, TPE1, TALB, ID3NoHeaderError

          output_file = f"audio/{os.environ['NEWSLETTER_DATE']}.mp3"
          subject = os.environ["NEWSLETTER_SUBJECT"]
          try:
              tags = ID3(output_file)
          except ID3NoHeaderError:
              tags = ID3()
          tags.add(TIT2(encoding=3, text=subject))
          tags.add(TPE1(encoding=3, text="Matt Levine"))
          tags.add(TALB(encoding=3, text="Money Stuff Podcast"))
          tags.save(output_file)
          print(f"MP3 size: {os.path.getsize(output_file)} bytes")
          EOF
      - name: Get MP3 file size
        id: filesize
        env:
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
        run: |
          SIZE=$(stat -c%s "audio/${NEWSLETTER_DATE}.mp3")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "MP3 size: $SIZE bytes"
      - name: Update RSS feed
        env:
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          GITHUB_USERNAME: fredasboss
          GITHUB_REPO: money-stuff-podcast
          FILE_SIZE: ${{ steps.filesize.outputs.size }}
        run: |
          python update_rss.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ feed.xml
          git commit -m "Add episode: ${{ github.event.client_payload.date }}"
          # the article feed may have pushed meanwhile; catch up before pushing
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
