name: Generate Money Stuff Podcast Episode (Piper)
on:
  repository_dispatch:
    types: [new_newsletter]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install "piper-tts>=1.3" mutagen
          which ffmpeg || sudo apt-get install -y ffmpeg
      - name: Download Piper voice
        env:
          PIPER_VOICE: en_US-ryan-high
        run: |
          mkdir -p voices
          cd voices
          python -m piper.download_voices "$PIPER_VOICE"
          ls -la
      - name: Generate narration with Piper
        env:
          NEWSLETTER_TEXT: ${{ toJson(github.event.client_payload.text) }}
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
          PIPER_VOICE: en_US-ryan-high
        run: |
          python - <<'EOF'
          import json
          import os
          import re
          import wave
          from piper import PiperVoice

          text = json.loads(os.environ["NEWSLETTER_TEXT"])
          subject = os.environ["NEWSLETTER_SUBJECT"]
          date = os.environ["NEWSLETTER_DATE"]

          # Remove URLs and tidy whitespace
          text = re.sub(r'https?://\S+', '', text)
          text = re.sub(r'\n{3,}', '\n\n', text).strip()

          # Join hard-wrapped lines inside a paragraph so the voice doesn't pause mid-sentence
          paragraphs = re.split(r'\n\s*\n', text)
          paragraphs = [re.sub(r'\s*\n\s*', ' ', p).strip() for p in paragraphs]
          text = "\n\n".join(p for p in paragraphs if p)

          intro = f"Money Stuff Newsletter. {subject}. {date}.\n\n"
          full_text = intro + text
          if len(full_text) > 80000:
              full_text = full_text[:80000] + "\n\nEnd of newsletter."

          voice = PiperVoice.load(f"voices/{os.environ['PIPER_VOICE']}.onnx")
          first = True
          with wave.open("narration.wav", "wb") as wav:
              for chunk in voice.synthesize(full_text):
                  if first:
                      wav.setframerate(chunk.sample_rate)
                      wav.setsampwidth(chunk.sample_width)
                      wav.setnchannels(chunk.sample_channels)
                      first = False
                  wav.writeframes(chunk.audio_int16_bytes)
          print("Narration saved to narration.wav")
          EOF
      - name: Convert to MP3 and add ID3 tags
        env:
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
        run: |
          mkdir -p audio
          ffmpeg -y -loglevel error -i narration.wav -ac 1 -codec:a libmp3lame -b:a 48k "audio/${NEWSLETTER_DATE}.mp3"
          python - <<'EOF'
          import os
          from mutagen.id3 import ID3, TIT2, TPE1, TALB, ID3NoHeaderError

          output_file = f"audio/{os.environ['NEWSLETTER_DATE']}.mp3"
          subject = os.environ["NEWSLETTER_SUBJECT"]
          try:
              tags = ID3(output_file)
          except ID3NoHeaderError:
              tags = ID3()
          tags.add(TIT2(encoding=3, text=subject))
          tags.add(TPE1(encoding=3, text="Matt Levine"))
          tags.add(TALB(encoding=3, text="Money Stuff Podcast"))
          tags.save(output_file)
          print(f"MP3 size: {os.path.getsize(output_file)} bytes")
          EOF
      - name: Get MP3 file size
        id: filesize
        env:
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
        run: |
          SIZE=$(stat -c%s "audio/${NEWSLETTER_DATE}.mp3")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "MP3 size: $SIZE bytes"
      - name: Update RSS feed
        env:
          NEWSLETTER_DATE: ${{ github.event.client_payload.date }}
          NEWSLETTER_SUBJECT: ${{ github.event.client_payload.subject }}
          GITHUB_USERNAME: fredasboss
          GITHUB_REPO: money-stuff-podcast
          FILE_SIZE: ${{ steps.filesize.outputs.size }}
        run: |
          python update_rss.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ feed.xml
          git commit -m "Add episode: ${{ github.event.client_payload.date }}"
          git push
